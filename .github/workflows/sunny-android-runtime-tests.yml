name: Sunny Android Runtime Tests

on:
  push:
    branches: [codex/sunny-runtime-android, entwicklung/sunny-2]
    paths:
      - 'sunny-core/**'
      - 'sunny-runtime-android/**'
      - 'app/**'
      - '*.gradle.kts'
      - '.github/workflows/sunny-android-runtime-tests.yml'
  pull_request:
    branches: [entwicklung/sunny-2]
    paths:
      - 'sunny-core/**'
      - 'sunny-runtime-android/**'
      - 'app/**'
      - '*.gradle.kts'
      - '.github/workflows/sunny-android-runtime-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.11.1
          cache-disabled: true
      - name: Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          if [ ! -f "$SDK/platforms/android-35/android.jar" ] || [ ! -x "$SDK/build-tools/35.0.0/aapt" ]; then
            MANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
            test -n "$MANAGER"
            "$MANAGER" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0"
          fi
          test -f "$SDK/platforms/android-35/android.jar"
          test -x "$SDK/build-tools/35.0.0/aapt"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      - name: Core tests
        run: gradle -p sunny-core --no-daemon --max-workers=4 clean test
      - name: Adapter tests and APK builds
        run: gradle --no-daemon --max-workers=4 :sunny-runtime-android:testDebugUnitTest :sunny-runtime-android:testReleaseUnitTest :app:testDebugUnitTest :app:assembleDebug :app:assembleLab
      - name: Verify JUnit results
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          suites = {
              'Core': ('sunny-core/build/test-results/test', 131),
              'Adapter Debug': ('sunny-runtime-android/build/test-results/testDebugUnitTest', 13),
              'Adapter Release': ('sunny-runtime-android/build/test-results/testReleaseUnitTest', 13),
              'App Debug': ('app/build/test-results/testDebugUnitTest', 93),
          }
          for name, (directory, minimum) in suites.items():
              totals = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
              files = list(pathlib.Path(directory).glob('TEST-*.xml'))
              assert files, name + ': missing reports'
              for file in files:
                  root = ET.parse(file).getroot()
                  for key in totals:
                      totals[key] += int(root.get(key, 0))
              print(name, totals)
              assert totals['tests'] >= minimum and not any(totals[k] for k in ('failures', 'errors', 'skipped')), name
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Sunny-Android-JUnit
          path: |
            sunny-core/build/test-results/test/
            sunny-runtime-android/build/test-results/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
      - name: Paket und Berechtigungen prüfen
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/lab/app-lab.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep -F "package: name='de.meinhelfer.tag.lab'"
          "$AAPT" dump badging "$APK" | grep -F "launchable-activity: name='de.meinhelfer.tag.lab.LabActivity'"
          test -n "$AAPT"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > lab-manifest.txt
          if grep -E 'de\.meinhelfer\.tag\.(MainActivity|reminder\.(BootReceiver|ReminderReceiver|TakenReceiver)|widget\.(HelperWidgetProvider|WidgetActionReceiver))' lab-manifest.txt; then
            echo "Produktiver Einstieg im Lab-Manifest"; exit 1
          fi
          "$AAPT" dump permissions "$APK" > lab-permissions.txt
          if grep -E 'android.permission.(INTERNET|REQUEST_INSTALL_PACKAGES|POST_NOTIFICATIONS|RECEIVE_BOOT_COMPLETED|USE_EXACT_ALARM|SCHEDULE_EXACT_ALARM|health\.)' lab-permissions.txt; then
            echo "Unerwartete produktive Berechtigung"; exit 1
          fi
      - name: Produktive APK prüfen
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='de.meinhelfer.tag'"
          "$AAPT" dump xmltree app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml > produktiv-manifest.txt
          if grep -F 'de.meinhelfer.tag.lab.LabActivity' produktiv-manifest.txt; then exit 1; fi
      - uses: actions/upload-artifact@v5
        with:
          name: MeinHelfer-DevTools
          path: |
            app/build/outputs/apk/lab/app-lab.apk
            lab-permissions.txt
            lab-manifest.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: MeinHelfer-Entwicklung
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            produktiv-manifest.txt
          if-no-files-found: error
