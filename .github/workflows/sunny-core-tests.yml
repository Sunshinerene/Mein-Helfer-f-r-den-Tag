name: Sunny Core Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [entwicklung/sunny-2]
    paths:
      - 'sunny-core/**'
      - '.github/workflows/sunny-core-tests.yml'
  push:
    branches: [entwicklung/sunny-2, codex/sunny-brain]
    paths:
      - 'sunny-core/**'
      - '.github/workflows/sunny-core-tests.yml'

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Sunny Core testen
        run: gradle -p sunny-core --no-daemon --max-workers=4 clean test
      - name: Testergebnisse kontrollieren
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          files = list(pathlib.Path('sunny-core/build/test-results/test').glob('TEST-*.xml'))
          assert files, 'Keine JUnit-Berichte'
          totals = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
          for file in files:
              root = ET.parse(file).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          print(totals)
          assert totals['tests'] >= 110, 'Weniger als 110 Tests'
          assert not any(totals[k] for k in ('failures', 'errors', 'skipped')), 'Tests nicht vollstaendig bestanden'
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: sunny-core-test-results
          path: |
            sunny-core/build/test-results/test/
            sunny-core/build/reports/tests/test/
          if-no-files-found: error
