name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Tests (Nutzungsbedingungen, Datenbank-Umstellungen, Rechenlogik)
        run: gradle testDebugUnitTest --stacktrace

      - name: Debug-APK bauen
        run: gradle assembleDebug --stacktrace

      - name: APK benennen
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "MeinHelfer-v$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MeinHelfer-APK
          path: MeinHelfer-v*.apk

      # Neue Version (versionName in app/build.gradle.kts erhoeht) wird automatisch als GitHub-Release
      # veroeffentlicht. Die App-interne Update-Funktion liest dieses Release.
      - name: Release veröffentlichen (nur bei neuer Version)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION existiert bereits, übersprungen."
          else
            NOTES=$(printf '%s' "$COMMIT_MSG" | grep -v -E '^(Co-Authored-By|Claude-Session):' || true)
            gh release create "v$VERSION" "MeinHelfer-v$VERSION.apk" \
              --title "v$VERSION" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
