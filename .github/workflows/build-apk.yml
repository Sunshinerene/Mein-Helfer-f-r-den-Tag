name: APK bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Debug-APK bauen
        run: gradle assembleDebug --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk MeinHelfer-${{ github.ref_name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MeinHelfer-APK
          path: MeinHelfer-*.apk

      # Bei Tags wie v0.1.0 wird die APK als GitHub-Release veroeffentlicht (Grundlage fuer die Update-Funktion).
      - name: Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MeinHelfer-*.apk
          generate_release_notes: true
