name: Backup Security Tests

on:
  workflow_dispatch:
  push:
    branches: [entwicklung/backup-security]
    paths:
      - 'app/src/lab/**'
      - 'app/src/main/**'
      - 'app/src/test/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/backup-security-tests.yml'

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.11.1
      - name: Lab APK bauen
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleLab --stacktrace
      - name: Verify security and regression tests
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          files = list(pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          assert files, 'Missing test reports'
          totals = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
          policy = False
          for file in files:
              root = ET.parse(file).getroot()
              for key in totals:
                  totals[key] += int(root.get(key, 0))
              if root.get('name', '').endswith('.DbStartupPolicyTest'):
                  policy = any(t.get('name') == 'all48InputCombinations' for t in root.findall('testcase'))
          print(totals)
          assert policy and totals['tests'] >= 94
          assert not any(totals[k] for k in ('failures', 'errors', 'skipped'))
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Backup-Security-JUnit
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
      - name: Paket und Berechtigungen prüfen
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/lab/app-lab.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep -F "package: name='de.meinhelfer.tag.lab'"
          "$AAPT" dump badging "$APK" | grep -F "launchable-activity: name='de.meinhelfer.tag.lab.LabActivity'"
          test -n "$AAPT"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > lab-manifest.txt
          if grep -E 'de\.meinhelfer\.tag\.(MainActivity|reminder\.(BootReceiver|ReminderReceiver|TakenReceiver)|widget\.(HelperWidgetProvider|WidgetActionReceiver))' lab-manifest.txt; then
            echo "Produktiver Einstieg im Lab-Manifest"; exit 1
          fi
          "$AAPT" dump permissions "$APK" > lab-permissions.txt
          if grep -E 'android.permission.(INTERNET|REQUEST_INSTALL_PACKAGES|POST_NOTIFICATIONS|RECEIVE_BOOT_COMPLETED|USE_EXACT_ALARM|SCHEDULE_EXACT_ALARM|health\.)' lab-permissions.txt; then
            echo "Unerwartete produktive Berechtigung"; exit 1
          fi
      - name: Produktive APK prüfen
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='de.meinhelfer.tag'"
          "$AAPT" dump xmltree app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml > produktiv-manifest.txt
          if grep -F 'de.meinhelfer.tag.lab.LabActivity' produktiv-manifest.txt; then exit 1; fi
      - uses: actions/upload-artifact@v5
        with:
          name: MeinHelfer-DevTools
          path: |
            app/build/outputs/apk/lab/app-lab.apk
            lab-permissions.txt
            lab-manifest.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: MeinHelfer-Entwicklung
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            produktiv-manifest.txt
          if-no-files-found: error
